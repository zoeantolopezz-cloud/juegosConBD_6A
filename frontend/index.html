<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183c36" />
    <title>Usuarios | Juegos 6A</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Juegos 6A, inicio">
        <span class="wordmark-icon" aria-hidden="true">J</span>
        <span>JUEGOS <b>6A</b></span>
      </a>
      <span class="topbar-label">Administración</span>
    </header>

    <main class="page-shell">
      <div class="page-heading">
        <div>
          <p class="eyebrow">JUEGOS_6A / USUARIOS</p>
          <h1>Gestión de usuarios</h1>
        </div>
        <span class="record-mark" aria-hidden="true">01</span>
      </div>

      <div id="mensaje" class="message" role="status" aria-live="polite" hidden></div>

      <section class="workspace" aria-label="Administración de usuarios">
        <aside class="editor-panel">
          <div class="section-heading">
            <span class="section-index">A</span>
            <h2 id="form-title">Nuevo usuario</h2>
          </div>
          <form id="usuario-form" novalidate>
            <label for="usu_usuario">Usuario</label>
            <input id="usu_usuario" name="usu_usuario" maxlength="50" autocomplete="username" required />

            <label for="usu_nombre">Nombre</label>
            <input id="usu_nombre" name="usu_nombre" maxlength="50" autocomplete="given-name" required />

            <label for="usu_apellido">Apellido</label>
            <input id="usu_apellido" name="usu_apellido" maxlength="50" autocomplete="family-name" required />

            <div class="form-actions">
              <button id="submit-button" class="button button-primary" type="submit">Registrar usuario</button>
              <button id="cancel-edit" class="button button-quiet" type="button" hidden>Cancelar edición</button>
            </div>
          </form>
          <p class="field-note">Todos los campos son obligatorios. Máximo 50 caracteres por campo.</p>
        </aside>

        <section class="records-panel" aria-labelledby="records-title">
          <div class="section-heading records-heading">
            <div class="heading-title">
              <span class="section-index">B</span>
              <h2 id="records-title">Usuarios registrados</h2>
            </div>
            <span id="record-count" class="record-count">0 registros</span>
          </div>

          <form id="buscar-form" class="search-form">
            <label for="buscar-id">Buscar por ID</label>
            <input id="buscar-id" type="number" min="1" step="1" inputmode="numeric" placeholder="Ej. 1" />
            <button class="button button-secondary" type="submit">Buscar</button>
            <button id="ver-todos" class="button button-quiet" type="button">Ver todos</button>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Usuario</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Apellido</th>
                  <th scope="col"><span class="visually-hidden">Acciones</span></th>
                </tr>
              </thead>
              <tbody id="usuarios-body"></tbody>
            </table>
          </div>
        </section>
      </section>
      <footer class="page-footer"><span>PROGRAMACIÓN / 6A</span><span>REGISTRO DE USUARIOS</span></footer>
    </main>
  </body>
</html>
